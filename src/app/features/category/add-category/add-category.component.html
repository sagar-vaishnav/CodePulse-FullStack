<div class="container">
    <h1 class="mt-3">Add Category</h1>
    <form #ngFrom (ngSubmit)="onFormSubmit()">
        <div class="mt-2">
            <div class="mt-3">
                <label for="from-label">Category Name</label>
                <input type="text" [(ngModel)]="model.name" id="categoryName" class="form-control" name="categoryName" />
            </div>

            <div class="mt-3">
                <label for="from-label">Category Url Handle</label>
                <input type="text" [(ngModel)]="model.urlHandle" id="categoryUrlHandle" class="form-control" name="categoryUrlHandle" />
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-primary">Add Category</button>
            </div>
        </div>
    </form>
</div>
