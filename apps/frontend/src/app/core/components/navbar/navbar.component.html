<nav class="navbar navbar-expand-lg navbar-custom sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand navbar-logo" [routerLink]="['/']">
      <i class="bi bi-lightning-fill me-2"></i>Code Pulse
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <!-- Left Menu -->
      <ul class="navbar-nav mb-2 mb-lg-0 align-items-center gap-lg-2">
        <li class="nav-item">
          <a
            class="nav-link navbar-link-item active"
            aria-current="page"
            [routerLink]="['/']"
          >
            <i class="bi bi-house me-2"></i>Home
          </a>
        </li>

        @if (user()?.roles?.includes("Writer")) {
          <li class="nav-item dropdown">
            <a
              class="nav-link dropdown-toggle navbar-link-item"
              href="#"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <i class="bi bi-gear me-2"></i>Admin
            </a>

            <ul class="dropdown-menu dropdown-menu-end admin-dropdown">
              <li>
                <a
                  class="dropdown-item admin-item"
                  [routerLink]="['/admin/categories']"
                >
                  <i class="bi bi-tag me-2"></i>Categories
                </a>
              </li>

              <li>
                <hr class="dropdown-divider" />
              </li>

              <li>
                <a
                  class="dropdown-item admin-item"
                  [routerLink]="['/admin/blogpost']"
                >
                  <i class="bi bi-file-text me-2"></i>Blog Posts
                </a>
              </li>

              <li>
                <hr class="dropdown-divider" />
              </li>

              <li>
                <a
                  class="dropdown-item admin-item"
                  [routerLink]="['/admin/blogpost/add']"
                >
                  <i class="bi bi-plus-circle me-2"></i>New Post
                </a>
              </li>
            </ul>
          </li>
        }

        <li class="nav-item">
          <a class="nav-link navbar-link-item" href="#">
            <i class="bi bi-question-circle me-2"></i>About
          </a>
        </li>
      </ul>

      <!-- Right Section -->
      <div class="d-flex ms-auto">
        @if (user() === undefined) {
          <!-- Login Button -->
          <a [routerLink]="['/login']" class="btn btn-outline-light me-2">
            <i class="bi bi-box-arrow-in-right me-1"></i>
            Login
          </a>
        } @else {
          <div class="user-section">
            <!-- User Info -->
            <div class="user-info">
              <div class="avatar">
                {{ user()?.email?.charAt(0)?.toUpperCase() }}
              </div>

              <div class="user-details">
                <span class="email">
                  {{ user()?.email }}
                </span>

                <span class="status"> Online </span>
              </div>
            </div>

            <!-- Logout -->
            <button class="logout-btn" (click)="logout()">
              <i class="bi bi-box-arrow-right"></i>
              <span>Logout</span>
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</nav>
