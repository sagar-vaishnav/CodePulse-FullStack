<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-12">
      <!-- Page Header -->
      <div
        class="card border-0 shadow-lg mb-4 overflow-hidden"
        style="
          border-radius: 1rem;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        "
      >
        <div class="card-body text-white p-4">
          <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3"
          >
            <div>
              <h1 class="h3 fw-bold mb-1">
                <i class="bi bi-tags-fill me-2"></i>
                Category Management
              </h1>
              <p class="mb-0 opacity-75">
                Manage your blog categories efficiently
              </p>
            </div>

            <a
              [routerLink]="['/admin/categories/add']"
              class="btn btn-light btn-lg fw-semibold px-4"
              style="border-radius: 0.75rem"
            >
              <i class="bi bi-plus-circle me-2"></i>
              Add Category
            </a>
          </div>
        </div>
      </div>

      <!-- Search Card -->
      <div class="card border-0 shadow-sm mb-4" style="border-radius: 1rem">
        <div class="card-body">
          <div class="row g-3 align-items-center">
            <div class="col-md-10">
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-white border-0">
                  <i class="bi bi-search text-muted"></i>
                </span>

                <input
                  type="text"
                  class="form-control border-0 shadow-none"
                  placeholder="Search categories..."
                  #queryText
                />
              </div>
            </div>

            <div class="col-md-2 d-grid">
              <button
                type="button"
                class="btn btn-warning fw-semibold"
                style="border-radius: 0.75rem"
                (click)="onSearch(queryText.value)"
              >
                <i class="bi bi-search me-1"></i>
                Search
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Categories Table -->
      <div
        class="card border-0 shadow-lg"
        style="border-radius: 1rem; min-height: 760px"
      >
        <div class="card-body p-0">
          <ng-container *ngIf="categories$ | async as categories">
            <!-- Empty State -->
            <div *ngIf="categories.length === 0" class="text-center py-5">
              <i class="bi bi-inbox display-1 text-muted"></i>

              <h4 class="mt-3 text-muted">No Categories Found</h4>

              <p class="text-muted">
                Try adjusting your search or add a new category.
              </p>
            </div>

            <!-- Table -->
            <div
              *ngIf="categories.length > 0"
              class="table-responsive overflow-hidden"
            >
              <table class="table align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th class="ps-4">#</th>

                    <th>
                      <div class="d-flex align-items-center gap-2">
                        Name

                        <button
                          type="button"
                          class="btn btn-sm btn-light"
                          (click)="sort('name', 'asc')"
                        >
                          <i class="bi bi-arrow-up"></i>
                        </button>

                        <button
                          type="button"
                          class="btn btn-sm btn-light"
                          (click)="sort('name', 'desc')"
                        >
                          <i class="bi bi-arrow-down"></i>
                        </button>
                      </div>
                    </th>

                    <th>
                      <div class="d-flex align-items-center gap-2">
                        URL Handle

                        <button
                          type="button"
                          class="btn btn-sm btn-light"
                          (click)="sort('urlHandle', 'asc')"
                        >
                          <i class="bi bi-arrow-up"></i>
                        </button>

                        <button
                          type="button"
                          class="btn btn-sm btn-light"
                          (click)="sort('urlHandle', 'desc')"
                        >
                          <i class="bi bi-arrow-down"></i>
                        </button>
                      </div>
                    </th>

                    <th class="text-center pe-4">Actions</th>
                  </tr>
                </thead>

                <tbody>
                  <tr
                    *ngFor="let category of categories; let i = index"
                    class="category-row"
                  >
                    <td class="ps-4 fw-semibold">
                      {{ i + 1 }}
                    </td>

                    <td>
                      <div class="fw-semibold">
                        {{ category.name }}
                      </div>
                    </td>

                    <td>
                      <span class="badge bg-light text-dark px-3 py-2">
                        {{ category.urlHandle }}
                      </span>
                    </td>

                    <td class="text-center pe-4">
                      <a
                        [routerLink]="['/admin/categories', category.id]"
                        class="btn btn-outline-primary btn-sm"
                        style="border-radius: 0.6rem"
                      >
                        <i class="bi bi-pencil-square me-1"></i>
                        Edit
                      </a>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Pagination -->
            <div class="d-flex justify-content-center p-4 border-top">
              <nav>
                <ul class="pagination mb-0">
                  <li class="page-item" [class.disabled]="pageNumber === 1">
                    <button
                      class="page-link"
                      (click)="getPreviousPage()"
                      [disabled]="pageNumber === 1"
                    >
                      <i class="bi bi-chevron-left"></i>
                      Previous
                    </button>
                  </li>
                  <li class="page-item" *ngIf="visiblePages[0] > 1">
                    <button class="page-link" (click)="getPage(1)">1</button>
                  </li>

                  <li class="page-item disabled" *ngIf="visiblePages[0] > 2">
                    <span class="page-link">...</span>
                  </li>
                  <li
                    *ngFor="let page of visiblePages"
                    class="page-item"
                    [class.active]="page === pageNumber"
                  >
                    <button class="page-link" (click)="getPage(page)">
                      {{ page }}
                    </button>
                  </li>
                  <li
                    class="page-item disabled"
                    *ngIf="
                      visiblePages[visiblePages.length - 1] < totalPages - 1
                    "
                  >
                    <span class="page-link">...</span>
                  </li>

                  <li
                    class="page-item"
                    *ngIf="visiblePages[visiblePages.length - 1] < totalPages"
                  >
                    <button class="page-link" (click)="getPage(totalPages)">
                      {{ totalPages }}
                    </button>
                  </li>

                  <li
                    class="page-item"
                    [class.disabled]="pageNumber === totalPages"
                  >
                    <button
                      class="page-link"
                      (click)="getNextPage()"
                      [disabled]="pageNumber === totalPages"
                    >
                      Next
                      <i class="bi bi-chevron-right"></i>
                    </button>
                  </li>
                </ul>
              </nav>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</div>
